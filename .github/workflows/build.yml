name: build

on:
  push:
    branches: [main]
    tags: ['*-wr*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, os: ubuntu-22.04 }
          - { target: linux-aarch64, os: ubuntu-22.04-arm }
          - { target: windows-x86_64, os: ubuntu-22.04 }
          - { target: macos-arm64, os: macos-14 }
          - { target: macos-x86_64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm pkg-config zip unzip ${{ matrix.target == 'windows-x86_64' && 'gcc-mingw-w64-x86-64' || '' }}
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm pkgconf
      - run: scripts/fetch-sources.sh
      - run: scripts/build.sh ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'windows-x86_64'
        run: |
          if [ "${{ matrix.target }}" = macos-x86_64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::no Rosetta on this runner; macos-x86_64 not run"; exit 0
          fi
          scripts/smoke-test.sh dist/*-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.zip
          if-no-files-found: error

  test-windows:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist
      - shell: bash
        run: scripts/smoke-test.sh dist/*-windows-x86_64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches version.env
        run: |
          . ./version.env
          test "${GITHUB_REF_NAME}" = "$FFMPEG_VERSION-$BUILD"
      - run: scripts/source-bundle.sh
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip *.tar > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./version.env
          {
            echo "FFmpeg $FFMPEG_VERSION with x264 \`$X264_COMMIT\` and zlib $ZLIB_VERSION: static, GPL-2.0-or-later, no nonfree parts."
            echo
            echo "Built by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from \`${GITHUB_SHA}\`."
            echo "\`ffmpeg-$FFMPEG_VERSION-$BUILD-source.tar\` is the corresponding source: the upstream tarballs and the scripts."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*.zip dist/*.tar dist/SHA256SUMS
